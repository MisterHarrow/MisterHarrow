name: Generate Maeul terrain

on:
  schedule:
    - cron: "0 1 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Maeul in the Sky - Contribution Terrain Visualizer
        uses: t1seo/maeul-in-the-sky@v2.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove header and collection panel, crop to timeline
        run: python3 .github/scripts/maeul-crop.py maeul-in-the-sky-dark.svg maeul-in-the-sky-light.svg

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update maeul-in-the-sky terrain"
          file_pattern: "maeul-in-the-sky-*.svg"
