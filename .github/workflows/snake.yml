name: Generate snake

on:
  schedule:
    - cron: "0 1 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate snake from contribution grid
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            github-snake.svg
            github-snake-dark.svg?palette=github-dark

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update contribution snake"
          file_pattern: "github-snake*.svg"
